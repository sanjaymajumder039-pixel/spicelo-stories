<body data-recipe-slug="pizza">

<div class="recipe-container">

    <h1>🍕 Pizza Recipe</h1>

    <img src="images/pizza.png" alt="Pizza">

    <div class="recipe-info">
        <span>⏱️ 20 min</span>
        <span>🍽️ 2 Servings</span>
        <span>📊 Easy</span>
    </div>

    <h2>Ingredients</h2>

    <ul>
        <li>Pizza Base</li>
        <li>Cheese</li>
        <li>Tomato Sauce</li>
        <li>Onion</li>
        <li>Capsicum</li>
        <li>Olives</li>
    </ul>

    <h2>Cooking Steps</h2>

    <ol>
        <li>Spread tomato sauce.</li>
        <li>Add vegetables.</li>
        <li>Add cheese.</li>
        <li>Bake for 15 minutes.</li>
        <li>Serve hot.</li>
    </ol>
    
<!-- Like & Comments -->
<section class="recipe-engagement">

    <div class="recipe-like">
        <button type="button" id="likeButton">
            ❤️ Like this recipe
        </button>

        <span id="likeCount">0 Likes</span>
    </div>

    <div class="recipe-comments">

        <h2>💬 Comments</h2>

        <form id="commentForm">

            <input
                type="text"
                id="commentName"
                placeholder="Your name"
                maxlength="50"
                required
            >

            <textarea
                id="commentText"
                placeholder="Write your comment..."
                maxlength="500"
                required
            ></textarea>

            <button type="submit">
                Post Comment
            </button>

        </form>

        <div id="commentMessage"></div>

        <div id="commentsList">
            <!-- Comments will appear here -->
        </div>

    </div>

</section>
